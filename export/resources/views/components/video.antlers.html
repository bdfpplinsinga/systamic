{{ base = "aspect-video w-full" }}


{{ if videoUrl | is_embeddable }}
    <!-- Youtube and Vimeo -->
    <iframe class="{{ [base, class] | tw_merge }}" src="{{ videoUrl | embed_url }}" ></iframe>
{{ else }}
    <!-- Other HTML5 video types -->
    <video class="{{ [base, class] | tw_merge }}" src="{{ videoUrl | embed_url }}" controls></video>
{{ /if }}
