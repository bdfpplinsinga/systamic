{{ partial:section class="isolate bg-white my-0" }}

    {{ partial:container class="lg:grid lg:grid-cols-12 lg:gap-x-8" }}

        <div class="pt-10 pb-24 sm:pb-32 lg:col-span-7 lg:pt-40 lg:pb-48 xl:col-span-6">
    
            <x-heading as="{{heading_tag}}">{{heading}}</x-heading>
            <x-prose size="lg" class="mt-8">{{description}}</x-prose>
            <div class="mt-10 flex items-center gap-x-6">
                {{ buttons}}
                    <x-button variant="{{variant}}" href="{{link}}">
                        {{label}}
                    </x-button>
                {{ /buttons}}
                
            </div>
          
        </div>

        <div class="relative lg:col-span-5 lg:-mr-8 xl:absolute xl:inset-0 xl:left-1/2 xl:mr-0">
            <x-picture cover="true"
                class="aspect-3/2 w-full bg-gray-50 object-cover lg:absolute lg:inset-0 lg:aspect-auto lg:h-full"
                image="{{image}}" 
            />
        </div>

    {{ /partial:container }}
{{ /partial:section }}
