title: Button
fields:
  -
    handle: label
    field:
      type: text
      display: Label
      localizable: true
      listable: false
      validate:
        - required
      width: 66
  -
    handle: variant
    field:
      type: select
      display: Variant
      options:
        primary: Primary
        secondary: Secondary
        ghost: Ghost
        link: Link
      default: primary
      localizable: true
      listable: false
      width: 33
  -
    handle: link
    field:
      type: link
      display: Link
      localizable: true
      listable: false
      validate:
        - required
